name: engine-validate
# The trade engine (reconcile/) — share-faithful Comtrade->BACI reconciliation + nowcast — was consolidated
# into this repo from the former standalone Varcolacus/comtrade-reconcile. This re-proves it reproduces end
# to end (raw Comtrade fixture -> reconciliation -> validated vs official BACI) and catches dependency drift.
on:
  push:
    paths: ['reconcile/**', '.github/workflows/engine-validate.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'   # monthly keepalive
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconcile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: End-to-end — reconcile the raw Comtrade fixture, then validate vs official BACI (no API key)
        run: |
          for Y in 2022 2024; do                              # two independent years, both key-free from committed fixtures
            ATLAS_ROOT=fixtures python reconcile.py $Y        # raw Comtrade (committed, gzipped) -> recon_$Y.csv
            ATLAS_ROOT=fixtures python validate.py $Y | tee out.txt
            grep -qE "EXPORTER : top-1 2[0-9]/30" out.txt
            grep -qE "IMPORTER : top-1 2[0-9]/30" out.txt
          done
          echo "end-to-end reproduced for 2022 + 2024: raw Comtrade -> reconciliation -> validated vs BACI, no key."
      - name: Out-of-sample backtest + the origin-gap finding (no API key)
        run: |
          python backtest.py
          python findings.py
          test -f results/backtest.json && test -f results/findings.json
          echo "backtest + findings reproduced."
